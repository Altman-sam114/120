name: Rustwar CI Results

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci-results:
    name: Build CI result package
    runs-on: macos-26
    env:
      CI_FLOW_VERSION: v1.2
      PROJECT_NAME: Rustwar
      WORKFLOW_DISPLAY_NAME: Rustwar CI Results
      DEVELOPER_DIR: /Applications/Xcode_26.5.app/Contents/Developer
      IOS_PROJECT: ios/RustwarIOS/RustwarIOS.xcodeproj
      IOS_SCHEME: RustwarIOS
      IOS_BUNDLE_ID: com.rustwar.prototype.ios
      IOS_VISUAL_SMOKE_ARGUMENT: --rustwar-ci-visual-smoke
      IOS_SIMULATOR_DEVICE_TYPE: com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro
      IOS_SIMULATOR_RUNTIME: com.apple.CoreSimulator.SimRuntime.iOS-26-5
      SWIFT_PACKAGE_PATH: swift/RustwarCore

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Prepare metadata
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ci-results
          short_sha="${GITHUB_SHA::7}"
          branch="${GITHUB_REF_NAME:-main}"
          branch_slug="$(printf '%s' "$branch" | tr '[:upper:]' '[:lower:]' | tr '/' '-' | tr -cd 'a-z0-9._-')"
          if [[ -z "$branch_slug" ]]; then
            branch_slug="main"
          fi
          artifact_name="rustwar-ci-${CI_FLOW_VERSION}-${branch_slug}-${short_sha}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          {
            echo "SHORT_SHA=$short_sha"
            echo "BRANCH_SLUG=$branch_slug"
            echo "ARTIFACT_NAME=$artifact_name"
          } >> "$GITHUB_ENV"

      - name: Run checks and write result package
        shell: bash
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set +e
          mkdir -p ci-results
          build_log="ci-results/build.log"
          {
            echo "Rustwar CI Results"
            echo "branch=${GITHUB_REF_NAME:-main}"
            echo "commit=${GITHUB_SHA}"
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "swift_package=${SWIFT_PACKAGE_PATH}"
            echo "ios_project=${IOS_PROJECT}"
            echo "ios_scheme=${IOS_SCHEME}"
            echo "ios_simulator_device_type=${IOS_SIMULATOR_DEVICE_TYPE}"
            echo "ios_simulator_runtime=${IOS_SIMULATOR_RUNTIME}"
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "developer_dir=${DEVELOPER_DIR}"
            echo
          } > "$build_log"

          echo "== pinned Apple toolchain ==" >> "$build_log"
          toolchain_status=0
          xcode_version="unavailable"
          xcode_build_version="unavailable"
          ios_simulator_sdk_version="unavailable"
          macos_version="unavailable"
          swift_version="unavailable"
          if [[ ! -d "$DEVELOPER_DIR" ]]; then
            echo "Missing pinned DEVELOPER_DIR: ${DEVELOPER_DIR}" >> "$build_log"
            toolchain_status=1
          else
            xcode_version_output="$(xcodebuild -version 2>> "$build_log")"
            xcode_version_status=$?
            xcode_version="$(printf '%s\n' "$xcode_version_output" | sed -n '1p')"
            xcode_build_version="$(printf '%s\n' "$xcode_version_output" | sed -n '2p')"
            ios_simulator_sdk_version="$(xcrun --sdk iphonesimulator --show-sdk-version 2>> "$build_log")"
            ios_sdk_status=$?
            macos_version="$(sw_vers -productVersion 2>> "$build_log")"
            macos_status=$?
            swift_version_output="$(swift --version 2>> "$build_log")"
            swift_version_status=$?
            swift_version="$(printf '%s\n' "$swift_version_output" | sed -n '1p')"
            if [[ "$xcode_version_status" -ne 0 || "$ios_sdk_status" -ne 0 || "$macos_status" -ne 0 || "$swift_version_status" -ne 0 ]]; then
              toolchain_status=1
            fi
            if [[ "$xcode_version" != "Xcode 26.5" || "$ios_simulator_sdk_version" != "26.5" ]]; then
              echo "Pinned toolchain mismatch: expected Xcode 26.5 / iOS Simulator SDK 26.5." >> "$build_log"
              toolchain_status=1
            fi
          fi
          {
            echo "runner_os=${RUNNER_OS:-unknown}"
            echo "runner_arch=${RUNNER_ARCH:-unknown}"
            echo "runner_name=${RUNNER_NAME:-unknown}"
            echo "macos_version=${macos_version}"
            echo "developer_dir=${DEVELOPER_DIR}"
            echo "xcode_version=${xcode_version}"
            echo "xcode_build_version=${xcode_build_version}"
            echo "ios_simulator_sdk_version=${ios_simulator_sdk_version}"
            echo "swift_version=${swift_version}"
            echo "toolchain_check_exit=${toolchain_status}"
          } | tee ci-results/toolchain-info.txt >> "$build_log"
          echo >> "$build_log"

          diff_base=""
          zero_sha="0000000000000000000000000000000000000000"
          if [[ -n "${BEFORE_SHA:-}" && "$BEFORE_SHA" != "$zero_sha" ]]; then
            diff_base="$BEFORE_SHA"
          elif git rev-parse "${GITHUB_SHA}^" >/dev/null 2>&1; then
            diff_base="$(git rev-parse "${GITHUB_SHA}^")"
          fi

          echo "== git diff --check ==" >> "$build_log"
          if [[ -n "$diff_base" ]]; then
            git diff --check "$diff_base" "$GITHUB_SHA" >> "$build_log" 2>&1
          else
            git diff --check >> "$build_log" 2>&1
          fi
          diff_status=$?
          echo "git diff --check exit=$diff_status" >> "$build_log"
          echo >> "$build_log"

          echo "== node --check app.js ==" >> "$build_log"
          node --check app.js >> "$build_log" 2>&1
          node_status=$?
          echo "node --check app.js exit=$node_status" >> "$build_log"
          echo >> "$build_log"

          echo "== swift test --package-path ${SWIFT_PACKAGE_PATH} ==" >> "$build_log"
          swift test --package-path "$SWIFT_PACKAGE_PATH" >> "$build_log" 2>&1
          swift_status=$?
          echo "swift test exit=$swift_status" >> "$build_log"
          echo >> "$build_log"

          echo "== xcodebuild -list ==" >> "$build_log"
          if [[ "$toolchain_status" -ne 0 ]]; then
            echo "Skipped: pinned Apple toolchain check did not succeed." >> "$build_log"
            xcode_list_status=77
          elif [[ -d "$IOS_PROJECT" ]]; then
            xcodebuild -list -project "$IOS_PROJECT" >> "$build_log" 2>&1
            xcode_list_status=$?
          else
            echo "Skipped: ${IOS_PROJECT} does not exist." >> "$build_log"
            xcode_list_status=77
          fi
          echo "xcodebuild -list exit=$xcode_list_status" >> "$build_log"
          echo >> "$build_log"

          echo "== create and boot pinned iOS Simulator ==" >> "$build_log"
          simulator_udid=""
          simulator_create_status=77
          simulator_boot_status=77
          if [[ "$xcode_list_status" -eq 0 ]]; then
            simulator_udid="$(xcrun simctl create \
              "Rustwar CI ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              "$IOS_SIMULATOR_DEVICE_TYPE" \
              "$IOS_SIMULATOR_RUNTIME" 2>> "$build_log")"
            simulator_create_status=$?
            if [[ "$simulator_create_status" -eq 0 ]]; then
              echo "simulator_udid=${simulator_udid}" >> "$build_log"
              xcrun simctl boot "$simulator_udid" >> "$build_log" 2>&1
              simulator_boot_status=$?
              if [[ "$simulator_boot_status" -eq 0 ]]; then
                xcrun simctl bootstatus "$simulator_udid" -b >> "$build_log" 2>&1
                simulator_boot_status=$?
              fi
            fi
          fi
          echo "simulator create exit=$simulator_create_status" >> "$build_log"
          echo "simulator boot exit=$simulator_boot_status" >> "$build_log"
          echo >> "$build_log"

          echo "== xcodebuild iOS Simulator app ==" >> "$build_log"
          derived_data_path="${RUNNER_TEMP}/RustwarDerivedData"
          if [[ "$simulator_boot_status" -eq 0 ]]; then
            xcodebuild \
              -project "$IOS_PROJECT" \
              -scheme "$IOS_SCHEME" \
              -destination "platform=iOS Simulator,id=${simulator_udid}" \
              -derivedDataPath "$derived_data_path" \
              ONLY_ACTIVE_ARCH=NO \
              ARCHS="arm64 x86_64" \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGN_IDENTITY="" \
              build >> "$build_log" 2>&1
            xcode_build_status=$?
          else
            echo "Skipped: pinned iOS Simulator did not boot successfully." >> "$build_log"
            xcode_build_status=77
          fi
          echo "xcodebuild build exit=$xcode_build_status" >> "$build_log"
          echo >> "$build_log"

          echo "== install, launch, and capture iOS app ==" >> "$build_log"
          simulator_install_status=77
          simulator_launch_status=77
          simulator_process_status=77
          simulator_screenshot_status=77
          screenshot_orientation_status=77
          screenshot_probe_status=77
          app_path="${derived_data_path}/Build/Products/Debug-iphonesimulator/RustwarIOS.app"
          screenshot_path="ci-results/ios-home.png"
          screenshot_metrics_path="ci-results/ios-screenshot-metrics.txt"
          if [[ "$xcode_build_status" -eq 0 ]]; then
            xcrun simctl install "$simulator_udid" "$app_path" >> "$build_log" 2>&1
            simulator_install_status=$?
            if [[ "$simulator_install_status" -eq 0 ]]; then
              launch_output="$(xcrun simctl launch \
                "$simulator_udid" \
                "$IOS_BUNDLE_ID" \
                "$IOS_VISUAL_SMOKE_ARGUMENT" 2>&1)"
              simulator_launch_status=$?
              printf '%s\n' "$launch_output" >> "$build_log"
            fi
            if [[ "$simulator_launch_status" -eq 0 ]]; then
              app_pid="$(printf '%s\n' "$launch_output" | sed -n 's/.*: \([0-9][0-9]*\)$/\1/p' | tail -1)"
              sleep 8
              if [[ "$app_pid" =~ ^[0-9]+$ ]]; then
                xcrun simctl spawn "$simulator_udid" launchctl print "pid/${app_pid}" >> "$build_log" 2>&1
                simulator_process_status=$?
              else
                echo "Unable to parse launched app PID from simctl output." >> "$build_log"
                simulator_process_status=1
              fi
            fi
            if [[ "$simulator_process_status" -eq 0 ]]; then
              xcrun simctl io "$simulator_udid" screenshot --type=png "$screenshot_path" >> "$build_log" 2>&1
              simulator_screenshot_status=$?
            fi
            if [[ "$simulator_screenshot_status" -eq 0 ]]; then
              sips --rotate 270 "$screenshot_path" >> "$build_log" 2>&1
              screenshot_orientation_status=$?
            fi
            if [[ "$screenshot_orientation_status" -eq 0 ]]; then
              xcrun swift ci/validate-ios-screenshot.swift \
                "$screenshot_path" \
                "$screenshot_metrics_path" >> "$build_log" 2>&1
              screenshot_probe_status=$?
            fi
          fi
          echo "simulator install exit=$simulator_install_status" >> "$build_log"
          echo "simulator launch exit=$simulator_launch_status" >> "$build_log"
          echo "simulator process alive exit=$simulator_process_status" >> "$build_log"
          echo "simulator screenshot exit=$simulator_screenshot_status" >> "$build_log"
          echo "screenshot landscape normalization exit=$screenshot_orientation_status" >> "$build_log"
          echo "screenshot pixel probe exit=$screenshot_probe_status" >> "$build_log"
          echo >> "$build_log"

          {
            echo "device_type=${IOS_SIMULATOR_DEVICE_TYPE}"
            echo "runtime=${IOS_SIMULATOR_RUNTIME}"
            echo "udid=${simulator_udid:-unavailable}"
            echo "bundle_id=${IOS_BUNDLE_ID}"
            echo "launch_argument=${IOS_VISUAL_SMOKE_ARGUMENT}"
            echo "create_exit=${simulator_create_status}"
            echo "boot_exit=${simulator_boot_status}"
            echo "build_exit=${xcode_build_status}"
            echo "install_exit=${simulator_install_status}"
            echo "launch_exit=${simulator_launch_status}"
            echo "process_alive_exit=${simulator_process_status}"
            echo "screenshot_exit=${simulator_screenshot_status}"
            echo "orientation_normalize_exit=${screenshot_orientation_status}"
            echo "pixel_probe_exit=${screenshot_probe_status}"
          } > ci-results/ios-simulator-info.txt

          if [[ -n "$simulator_udid" ]]; then
            echo "== clean up iOS Simulator ==" >> "$build_log"
            xcrun simctl shutdown "$simulator_udid" >> "$build_log" 2>&1
            echo "simulator shutdown exit=$?" >> "$build_log"
            xcrun simctl delete "$simulator_udid" >> "$build_log" 2>&1
            echo "simulator delete exit=$?" >> "$build_log"
            echo >> "$build_log"
          fi

          if [[ "$simulator_create_status" -eq 0 && "$simulator_boot_status" -eq 0 && "$simulator_install_status" -eq 0 && "$simulator_launch_status" -eq 0 && "$simulator_process_status" -eq 0 && "$simulator_screenshot_status" -eq 0 && "$screenshot_orientation_status" -eq 0 && "$screenshot_probe_status" -eq 0 ]]; then
            simulator_visual_status=0
          else
            simulator_visual_status=1
          fi

          {
            echo "## CI Failure Summary"
            if [[ "$toolchain_status" -eq 0 && "$diff_status" -eq 0 && "$node_status" -eq 0 && "$swift_status" -eq 0 && "$xcode_list_status" -eq 0 && "$xcode_build_status" -eq 0 && "$simulator_visual_status" -eq 0 ]]; then
              echo "- Result: success"
            else
              echo "- Result: failure"
            fi
            echo "- pinned Xcode 26.5 / iOS Simulator SDK 26.5: $([[ "$toolchain_status" -eq 0 ]] && echo success || echo failure)"
            echo "- git diff --check: $([[ "$diff_status" -eq 0 ]] && echo success || echo failure)"
            echo "- node --check app.js: $([[ "$node_status" -eq 0 ]] && echo success || echo failure)"
            echo "- swift test --package-path ${SWIFT_PACKAGE_PATH}: $([[ "$swift_status" -eq 0 ]] && echo success || echo failure)"
            echo "- xcodebuild -list ${IOS_PROJECT}: $([[ "$xcode_list_status" -eq 0 ]] && echo success || echo failure)"
            echo "- xcodebuild ${IOS_SCHEME}: $([[ "$xcode_build_status" -eq 0 ]] && echo success || echo failure)"
            echo "- iOS Simulator launch and screenshot: $([[ "$simulator_visual_status" -eq 0 ]] && echo success || echo failure)"
            echo "- Browser smoke/regression: skipped; Rustwar currently has no headless browser CI."
          } > ci-results/ci-failure-summary.md

          {
            echo "## git status --short --branch"
            git status --short --branch
            echo
            echo "## git log --oneline -5"
            git log --oneline -5
          } > ci-results/repo-state.txt

          if [[ "$toolchain_status" -eq 0 && "$diff_status" -eq 0 && "$node_status" -eq 0 && "$swift_status" -eq 0 && "$xcode_list_status" -eq 0 && "$xcode_build_status" -eq 0 && "$simulator_visual_status" -eq 0 ]]; then
            overall="success"
          else
            overall="failure"
          fi
          echo "$overall" > ci-results/overall-status.txt

          CHECK_TOOLCHAIN_STATUS="$toolchain_status" \
          CHECK_DIFF_STATUS="$diff_status" \
          CHECK_NODE_STATUS="$node_status" \
          CHECK_SWIFT_STATUS="$swift_status" \
          CHECK_XCODE_LIST_STATUS="$xcode_list_status" \
          CHECK_XCODE_BUILD_STATUS="$xcode_build_status" \
          CHECK_SIMULATOR_VISUAL_STATUS="$simulator_visual_status" \
          CHECK_SIMULATOR_LAUNCH_STATUS="$([[ "$simulator_launch_status" -eq 0 && "$simulator_process_status" -eq 0 ]] && echo 0 || echo 1)" \
          CHECK_SIMULATOR_SCREENSHOT_STATUS="$simulator_screenshot_status" \
          CHECK_SCREENSHOT_ORIENTATION_STATUS="$screenshot_orientation_status" \
          CHECK_SCREENSHOT_PROBE_STATUS="$screenshot_probe_status" \
          IOS_SIMULATOR_UDID="$simulator_udid" \
          XCODE_VERSION="$xcode_version" \
          XCODE_BUILD_VERSION="$xcode_build_version" \
          IOS_SIMULATOR_SDK_VERSION="$ios_simulator_sdk_version" \
          MACOS_VERSION="$macos_version" \
          SWIFT_VERSION="$swift_version" \
          OVERALL_STATUS="$overall" \
          node <<'NODE'
          const fs = require("fs");

          const escapeXml = (value) => String(value)
            .replace(/&/g, "&amp;")
            .replace(/</g, "&lt;")
            .replace(/>/g, "&gt;")
            .replace(/"/g, "&quot;")
            .replace(/'/g, "&apos;");

          const checks = [
            {
              name: "pinned Xcode 26.5 toolchain",
              ok: process.env.CHECK_TOOLCHAIN_STATUS === "0",
              message: "Pinned Xcode 26.5 and iOS Simulator SDK 26.5 metadata check."
            },
            {
              name: "git diff --check",
              ok: process.env.CHECK_DIFF_STATUS === "0",
              message: "Whitespace and conflict marker check for this commit range."
            },
            {
              name: "node --check app.js",
              ok: process.env.CHECK_NODE_STATUS === "0",
              message: "JavaScript syntax check for the web RTS runtime."
            },
            {
              name: "swift test RustwarCore",
              ok: process.env.CHECK_SWIFT_STATUS === "0",
              message: "Swift package tests for shared native RTS core."
            },
            {
              name: "xcodebuild -list RustwarIOS",
              ok: process.env.CHECK_XCODE_LIST_STATUS === "0",
              skipped: process.env.CHECK_XCODE_LIST_STATUS === "77",
              message: "Xcode project and scheme discovery for the native iOS app."
            },
            {
              name: "xcodebuild RustwarIOS",
              ok: process.env.CHECK_XCODE_BUILD_STATUS === "0",
              skipped: process.env.CHECK_XCODE_BUILD_STATUS === "77",
              message: "Native iOS app build with code signing disabled."
            },
            {
              name: "iOS Simulator launch and screenshot",
              ok: process.env.CHECK_SIMULATOR_VISUAL_STATUS === "0",
              message: "Pinned iPhone 17 Pro launch, PNG capture, and nonblank pixel probe."
            },
            {
              name: "browser smoke regression",
              skipped: true,
              message: "Skipped: Rustwar currently has no headless browser CI."
            }
          ];

          const failures = checks.filter((check) => check.ok === false && !check.skipped).length;
          const skipped = checks.filter((check) => check.skipped).length;
          const cases = checks.map((check) => {
            if (check.skipped) {
              return `    <testcase classname="rustwar.ci" name="${escapeXml(check.name)}"><skipped message="${escapeXml(check.message)}"/></testcase>`;
            }
            if (!check.ok) {
              return `    <testcase classname="rustwar.ci" name="${escapeXml(check.name)}"><failure message="${escapeXml(check.message)}">See ci-results/build.log and ci-results/ci-failure-summary.md.</failure></testcase>`;
            }
            return `    <testcase classname="rustwar.ci" name="${escapeXml(check.name)}"/>`;
          }).join("\n");

          const junit = [
            '<?xml version="1.0" encoding="UTF-8"?>',
            `<testsuites tests="${checks.length}" failures="${failures}" skipped="${skipped}">`,
            `  <testsuite name="Rustwar CI Results" tests="${checks.length}" failures="${failures}" skipped="${skipped}">`,
            cases,
            "  </testsuite>",
            "</testsuites>",
            ""
          ].join("\n");
          fs.writeFileSync("ci-results/junit.xml", junit);

          const manifest = {
            version: process.env.CI_FLOW_VERSION,
            branch: process.env.GITHUB_REF_NAME || "main",
            commitSha: process.env.GITHUB_SHA,
            shortSha: process.env.SHORT_SHA,
            runId: process.env.GITHUB_RUN_ID,
            runAttempt: process.env.GITHUB_RUN_ATTEMPT,
            workflowName: process.env.WORKFLOW_DISPLAY_NAME,
            createdAt: new Date().toISOString(),
            projectName: process.env.PROJECT_NAME,
            scheme: process.env.IOS_SCHEME,
            destination: `platform=iOS Simulator,id=${process.env.IOS_SIMULATOR_UDID}`,
            simulatorDeviceType: process.env.IOS_SIMULATOR_DEVICE_TYPE,
            simulatorRuntime: process.env.IOS_SIMULATOR_RUNTIME,
            simulatorUDID: process.env.IOS_SIMULATOR_UDID,
            appBundleID: process.env.IOS_BUNDLE_ID,
            visualSmokeLaunchArgument: process.env.IOS_VISUAL_SMOKE_ARGUMENT,
            runnerOS: process.env.RUNNER_OS || null,
            runnerArch: process.env.RUNNER_ARCH || null,
            runnerName: process.env.RUNNER_NAME || null,
            macOSVersion: process.env.MACOS_VERSION,
            developerDir: process.env.DEVELOPER_DIR,
            xcodeVersion: process.env.XCODE_VERSION,
            xcodeBuildVersion: process.env.XCODE_BUILD_VERSION,
            iOSSimulatorSDKVersion: process.env.IOS_SIMULATOR_SDK_VERSION,
            swiftVersion: process.env.SWIFT_VERSION,
            toolchainOutcome: process.env.CHECK_TOOLCHAIN_STATUS === "0" ? "success" : "failure",
            resultBundlePath: null,
            junitPath: "ci-results/junit.xml",
            buildLogPath: "ci-results/build.log",
            failureSummaryPath: "ci-results/ci-failure-summary.md",
            staticChecksOutcome: process.env.CHECK_DIFF_STATUS === "0" && process.env.CHECK_NODE_STATUS === "0" ? "success" : "failure",
            buildOutcome: process.env.CHECK_XCODE_BUILD_STATUS === "0" ? "success" : "failure",
            simulatorVisualOutcome: process.env.CHECK_SIMULATOR_VISUAL_STATUS === "0" ? "success" : "failure",
            simulatorLaunchOutcome: process.env.CHECK_SIMULATOR_LAUNCH_STATUS === "0" ? "success" : "failure",
            screenshotOutcome: process.env.CHECK_SIMULATOR_SCREENSHOT_STATUS === "0" ? "success" : "failure",
            screenshotOrientationOutcome: process.env.CHECK_SCREENSHOT_ORIENTATION_STATUS === "0" ? "success" : "failure",
            screenshotProbeOutcome: process.env.CHECK_SCREENSHOT_PROBE_STATUS === "0" ? "success" : "failure",
            screenshotPath: process.env.CHECK_SIMULATOR_SCREENSHOT_STATUS === "0" ? "ci-results/ios-home.png" : null,
            screenshotMetricsPath: process.env.CHECK_SCREENSHOT_PROBE_STATUS === "0" ? "ci-results/ios-screenshot-metrics.txt" : null,
            testOutcome: process.env.CHECK_SWIFT_STATUS === "0" ? "success" : "failure",
            swiftPackagePath: process.env.SWIFT_PACKAGE_PATH,
            swiftPackageOutcome: process.env.CHECK_SWIFT_STATUS === "0" ? "success" : "failure",
            xcodeProject: process.env.IOS_PROJECT,
            xcodeListOutcome: process.env.CHECK_XCODE_LIST_STATUS === "0" ? "success" : "failure",
            projectSpecificReports: [
              "ci-results/repo-state.txt",
              "ci-results/toolchain-info.txt",
              "ci-results/ios-simulator-info.txt"
            ]
          };
          fs.writeFileSync("ci-results/ci-artifact-manifest.json", `${JSON.stringify(manifest, null, 2)}\n`);
          NODE

      - name: Upload CI result package
        uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ci-results
          if-no-files-found: error

      - name: Fail when checks failed
        if: always()
        shell: bash
        run: |
          test "$(cat ci-results/overall-status.txt)" = "success"
